<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Management | Gayatri Industries</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Segoe UI,sans-serif;
  background:#030914;
  color:#edf5ff;
  min-height:100vh;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 10% 10%,rgba(0,115,255,.16),transparent 28%),
    radial-gradient(circle at 90% 90%,rgba(255,100,0,.10),transparent 30%),
    #030914;
}

.grid{
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:
    linear-gradient(rgba(70,150,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,150,255,.04) 1px,transparent 1px);
  background-size:42px 42px;
}

/* HEADER */

.header{
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(3,9,20,.75);
  backdrop-filter:blur(15px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  background:linear-gradient(135deg,#137ee9,#062b55);
}

.brand h2{
  font-size:17px;
}

.brand p{
  font-size:10px;
  color:#8192a8;
  margin-top:3px;
  letter-spacing:1px;
}

.header-actions{
  display:flex;
  gap:10px;
}

/* BUTTONS */

.btn{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
  color:white;
}

.dashboard-btn{
  background:#0b57a4;
}

.logout-btn{
  background:linear-gradient(135deg,#e5484d,#a91d27);
}

.add-btn{
  background:linear-gradient(135deg,#137ee9,#0b57a4);
  padding:13px 20px;
}

/* MAIN */

.main{
  width:90%;
  max-width:1200px;
  margin:35px auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.top h1{
  font-size:28px;
}

.top p{
  margin-top:6px;
  color:#8393a8;
  font-size:12px;
}

/* SEARCH */

.controls{
  margin-bottom:20px;
}

.search-box{
  width:100%;
  padding:14px 16px;
  background:#061326;
  border:1px solid rgba(70,140,255,.2);
  border-radius:12px;
  color:white;
  outline:none;
}

/* TABLE */

.table-card{
  background:#071426;
  border:1px solid rgba(70,140,255,.15);
  border-radius:20px;
  overflow:hidden;
}

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:15px 20px;
  font-size:10px;
  color:#8192a8;
  background:rgba(255,255,255,.02);
}

td{
  padding:16px 20px;
  font-size:12px;
  border-top:1px solid rgba(255,255,255,.06);
}

/* PHOTOS */

.employee-photo{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#0b68c4;
  border:1px solid rgba(255,255,255,.15);
}

.photo-placeholder{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#137ee9,#062b55);
  font-weight:bold;
  font-size:14px;
}

/* ACTIONS */

.action-btn{
  padding:7px 11px;
  border:none;
  border-radius:7px;
  color:white;
  cursor:pointer;
  font-size:10px;
  margin-right:5px;
}

.edit-btn{
  background:#0b68c4;
}

.delete-btn{
  background:#c62f38;
}

.loading{
  text-align:center;
  padding:35px;
  color:#8192a8;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow-y:auto;
  background:#071426;
  border:1px solid rgba(70,140,255,.2);
  border-radius:20px;
  padding:25px;
}

.modal-box h2{
  margin-bottom:20px;
  font-size:20px;
}

/* FORM */

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:11px;
  color:#8fa1b8;
}

.field input,
.field select{
  width:100%;
  padding:13px;
  background:#061326;
  border:1px solid rgba(70,140,255,.2);
  border-radius:10px;
  color:white;
  outline:none;
}

/* PHOTO UPLOAD */

.photo-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:20px;
}

.photo-preview{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  display:none;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.15);
}

.photo-placeholder.large{
  width:110px;
  height:110px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:35px;
  margin-bottom:12px;
}

.photo-upload-label{
  display:inline-block;
  background:#0b68c4;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.photo-upload-label input{
  display:none;
}

.photo-note{
  font-size:9px;
  color:#8192a8;
  margin-top:8px;
}

/* MODAL BUTTONS */

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.cancel-btn{
  background:#26384d;
}

.save-btn{
  background:#0b68c4;
}

@media(max-width:600px){

  .header{
    padding:16px;
  }

  .main{
    width:92%;
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

  .header-actions .btn{
    padding:9px 10px;
  }

}

</style>

</head>

<body>

<div class="grid"></div>

<!-- HEADER -->

<header class="header">

  <div class="brand">

    <div class="logo">👥</div>

    <div>
      <h2>Gayatri Industries</h2>
      <p>EMPLOYEE MANAGEMENT</p>
    </div>

  </div>

  <div class="header-actions">

    <button
      class="btn dashboard-btn"
      onclick="window.location.href='./admin.html'">
      Dashboard
    </button>

    <button
      class="btn logout-btn"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>


<!-- MAIN -->

<main class="main">

  <div class="top">

    <div>
      <h1>Employees</h1>
      <p>Add, edit and manage company employees.</p>
    </div>

    <button
      class="btn add-btn"
      onclick="openAddModal()">
      + Add Employee
    </button>

  </div>


  <!-- SEARCH -->

  <div class="controls">

    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="🔍 Search by employee name, ID or department..."
    >

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>PHOTO</th>
            <th>EMPLOYEE ID</th>
            <th>NAME</th>
            <th>DEPARTMENT</th>
            <th>ACTIONS</th>
          </tr>

        </thead>

        <tbody id="employeeBody">

          <tr>
            <td colspan="5" class="loading">
              Loading employees...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="employeeModal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Employee</h2>


    <!-- PHOTO -->

    <div class="photo-section">

      <div
        id="photoPlaceholder"
        class="photo-placeholder large">
        👤
      </div>

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Employee Photo"
      >

      <label class="photo-upload-label">

        📷 Upload Employee Photo

        <input
          type="file"
          id="employeePhoto"
          accept="image/*"
          onchange="previewPhoto(event)"
        >

      </label>

      <div class="photo-note">
        JPG, PNG or WEBP • Recommended square photo
      </div>

    </div>


    <!-- EMPLOYEE ID -->

    <div class="field">

      <label>Employee ID</label>

      <input
        type="text"
        id="employeeId"
        placeholder="Example: GI-001"
      >

    </div>


    <!-- EMPLOYEE NAME -->

    <div class="field">

      <label>Employee Name</label>

      <input
        type="text"
        id="employeeName"
        placeholder="Enter employee name"
      >

    </div>


    <!-- DEPARTMENT -->

    <div class="field">

      <label>Department</label>

      <input
        type="text"
        id="department"
        placeholder="Example: Production"
      >

    </div>


    <!-- BUTTONS -->

    <div class="modal-actions">

      <button
        class="btn cancel-btn"
        onclick="closeModal()">
        Cancel
      </button>

      <button
        class="btn save-btn"
        id="saveBtn"
        onclick="saveEmployee()">
        Save Employee
      </button>

    </div>

  </div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://ysdpsndophokczdqysiw.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZHBzbmRvcGhva2N6ZHF5c2l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDE4OTMsImV4cCI6MjEwMjcxNzg5M30.OOUs696nMFc8TByXE39U2PBELo_gUurq6npcPsoG8Ww";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true
    }
  }
);


/* VARIABLES */

let editingEmployeeId = null;
let employeesData = [];
let selectedPhotoFile = null;
let existingPhotoUrl = null;


/* LOAD EMPLOYEES */

async function loadEmployees(){

  const body =
  document.getElementById("employeeBody");

  body.innerHTML = `
    <tr>
      <td colspan="5" class="loading">
        Loading employees...
      </td>
    </tr>
  `;

  const { data, error } =
  await supabaseClient
  .from("employees")
  .select("*")
  .order("employee_id",{ascending:true});

  if(error){

    console.error(error);

    body.innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          Error loading employees: ${error.message}
        </td>
      </tr>
    `;

    return;
  }

  employeesData = data || [];

  renderEmployees();

}


/* INITIALS */

function getInitials(name){

  if(!name){
    return "?";
  }

  return name
  .split(" ")
  .map(word => word.charAt(0))
  .slice(0,2)
  .join("")
  .toUpperCase();

}


/* RENDER */

function renderEmployees(){

  const body =
  document.getElementById("employeeBody");

  const search =
  document
  .getElementById("searchInput")
  .value
  .toLowerCase();

  const filtered =
  employeesData.filter(employee => {

    return (
      (employee.employee_id || "")
      .toLowerCase()
      .includes(search)

      ||

      (employee.name || "")
      .toLowerCase()
      .includes(search)

      ||

      (employee.department || "")
      .toLowerCase()
      .includes(search)
    );

  });

  if(filtered.length === 0){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          No employees found.
        </td>
      </tr>
    `;

    return;
  }

  body.innerHTML =
  filtered.map(employee => `

    <tr>

      <td>

        ${
          employee.photo_url
          ?
          `
            <img
              src="${employee.photo_url}"
              class="employee-photo"
              alt="${employee.name}"
            >
          `
          :
          `
            <div class="photo-placeholder">
              ${getInitials(employee.name)}
            </div>
          `
        }

      </td>

      <td>${employee.employee_id || "—"}</td>

      <td>${employee.name || "—"}</td>

      <td>${employee.department || "—"}</td>

      <td>

        <button
          class="action-btn edit-btn"
          onclick="editEmployee('${employee.employee_id}')">
          Edit
        </button>

        <button
          class="action-btn delete-btn"
          onclick="deleteEmployee('${employee.employee_id}')">
          Delete
        </button>

      </td>

    </tr>

  `).join("");

}


/* PHOTO PREVIEW */

function previewPhoto(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  selectedPhotoFile = file;

  const preview =
  document.getElementById("photoPreview");

  const placeholder =
  document.getElementById("photoPlaceholder");

  preview.src =
  URL.createObjectURL(file);

  preview.style.display = "block";

  placeholder.style.display = "none";

}


/* RESET PHOTO */

function resetPhoto(){

  selectedPhotoFile = null;
  existingPhotoUrl = null;

  document
  .getElementById("employeePhoto")
  .value = "";

  const preview =
  document.getElementById("photoPreview");

  preview.src = "";
  preview.style.display = "none";

  const placeholder =
  document.getElementById("photoPlaceholder");

  placeholder.style.display = "grid";
  placeholder.textContent = "👤";

}


/* OPEN ADD MODAL */

function openAddModal(){

  editingEmployeeId = null;

  document
  .getElementById("modalTitle")
  .textContent =
  "Add Employee";

  document
  .getElementById("employeeId")
  .value = "";

  document
  .getElementById("employeeName")
  .value = "";

  document
  .getElementById("department")
  .value = "";

  document
  .getElementById("employeeId")
  .disabled = false;

  document
  .getElementById("saveBtn")
  .textContent =
  "Save Employee";

  resetPhoto();

  document
  .getElementById("employeeModal")
  .classList.add("show");

}


/* EDIT */

function editEmployee(employeeId){

  const employee =
  employeesData.find(
    item => item.employee_id === employeeId
  );

  if(!employee){
    return;
  }

  editingEmployeeId =
  employee.employee_id;

  existingPhotoUrl =
  employee.photo_url || null;

  selectedPhotoFile = null;

  document
  .getElementById("modalTitle")
  .textContent =
  "Edit Employee";

  document
  .getElementById("employeeId")
  .value =
  employee.employee_id;

  document
  .getElementById("employeeName")
  .value =
  employee.name || "";

  document
  .getElementById("department")
  .value =
  employee.department || "";

  document
  .getElementById("employeeId")
  .disabled = true;

  document
  .getElementById("saveBtn")
  .textContent =
  "Update Employee";

  document
  .getElementById("employeePhoto")
  .value = "";

  const preview =
  document.getElementById("photoPreview");

  const placeholder =
  document.getElementById("photoPlaceholder");

  if(existingPhotoUrl){

    preview.src =
    existingPhotoUrl;

    preview.style.display =
    "block";

    placeholder.style.display =
    "none";

  }
  else{

    preview.src = "";

    preview.style.display =
    "none";

    placeholder.style.display =
    "grid";

    placeholder.textContent =
    getInitials(employee.name);

  }

  document
  .getElementById("employeeModal")
  .classList.add("show");

}


/* CLOSE MODAL */

function closeModal(){

  document
  .getElementById("employeeModal")
  .classList.remove("show");

}


/* UPLOAD PHOTO */

async function uploadPhoto(employeeId){

  if(!selectedPhotoFile){
    return existingPhotoUrl;
  }

  const extension =
  selectedPhotoFile.name
  .split(".")
  .pop();

  const fileName =
  `${employeeId}-${Date.now()}.${extension}`;

  const filePath =
  `employees/${fileName}`;

  const {
    error: uploadError
  } =
  await supabaseClient
  .storage
  .from("employee-photos")
  .upload(
    filePath,
    selectedPhotoFile,
    {
      upsert:false
    }
  );

  if(uploadError){
    throw uploadError;
  }

  const { data } =
  supabaseClient
  .storage
  .from("employee-photos")
  .getPublicUrl(filePath);

  return data.publicUrl;

}


/* SAVE EMPLOYEE */

async function saveEmployee(){

  const employeeId =
  document
  .getElementById("employeeId")
  .value
  .trim();

  const name =
  document
  .getElementById("employeeName")
  .value
  .trim();

  const department =
  document
  .getElementById("department")
  .value
  .trim();

  if(!employeeId || !name){

    alert(
      "Please enter Employee ID and Name."
    );

    return;
  }

  const saveBtn =
  document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.textContent =
  "Saving...";

  try{

    let photoUrl =
    existingPhotoUrl;

    if(selectedPhotoFile){

      saveBtn.textContent =
      "Uploading photo...";

      photoUrl =
      await uploadPhoto(employeeId);

    }

    saveBtn.textContent =
    "Saving employee...";

    let error;

    if(!editingEmployeeId){

      const result =
      await supabaseClient
      .from("employees")
      .insert([{
        employee_id:employeeId,
        name:name,
        department:department,
        photo_url:photoUrl
      }]);

      error = result.error;

    }
    else{

      const result =
      await supabaseClient
      .from("employees")
      .update({
        name:name,
        department:department,
        photo_url:photoUrl
      })
      .eq(
        "employee_id",
        editingEmployeeId
      );

      error = result.error;

    }

    if(error){
      throw error;
    }

    alert(
      editingEmployeeId
      ?
      "Employee updated successfully!"
      :
      "Employee added successfully!"
    );

    closeModal();

    await loadEmployees();

  }
  catch(error){

    console.error(error);

    alert(
      "Error: " +
      error.message
    );

  }
  finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
    editingEmployeeId
    ?
    "Update Employee"
    :
    "Save Employee";

  }

}


/* DELETE */

async function deleteEmployee(employeeId){

  const confirmDelete =
  confirm(
    "Are you sure you want to delete employee " +
    employeeId +
    "?"
  );

  if(!confirmDelete){
    return;
  }

  const { error } =
  await supabaseClient
  .from("employees")
  .delete()
  .eq(
    "employee_id",
    employeeId
  );

  if(error){

    console.error(error);

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }

  alert(
    "Employee deleted successfully!"
  );

  await loadEmployees();

}


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
  "input",
  renderEmployees
);


/* LOGOUT */

async function logout(){

  if(
    !confirm(
      "Are you sure you want to logout?"
    )
  ){
    return;
  }

  await supabaseClient
  .auth
  .signOut();

  window.location.replace(
    "./login.html"
  );

}


/* INITIALIZE */

async function initialize(){

  /*
    Important:
    Yaha getUser() check nahi hai.
    Isliye session check fail hone par
    page automatically logout nahi hoga.
  */

  await loadEmployees();

}

initialize();

</script>

</body>
</html>
