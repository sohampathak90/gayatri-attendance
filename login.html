<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Gayatri Industries</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Segoe UI,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#030914;
  color:white;
  padding:20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 20% 20%,rgba(0,115,255,.18),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(255,100,0,.12),transparent 30%);
}

.grid{
  position:fixed;
  inset:0;
  z-index:-1;

  background-image:
    linear-gradient(rgba(70,150,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,150,255,.04) 1px,transparent 1px);

  background-size:42px 42px;
}

.login-box{
  width:100%;
  max-width:430px;
  padding:35px;
  border-radius:25px;

  background:linear-gradient(145deg,#0a1b31,#061222);

  border:1px solid rgba(70,140,255,.2);

  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.logo{
  width:70px;
  height:70px;

  margin:auto;

  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:32px;

  background:linear-gradient(135deg,#137ee9,#062b55);
}

h1{
  text-align:center;
  margin-top:18px;
  font-size:26px;
}

.subtitle{
  text-align:center;
  margin-top:8px;
  font-size:11px;
  color:#8293a8;
  letter-spacing:1px;
}

.field{
  margin-top:25px;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-size:11px;
  color:#9aacbf;
}

.field input{
  width:100%;
  padding:15px;

  border-radius:12px;

  border:1px solid rgba(70,140,255,.25);

  background:#061326;

  color:white;

  outline:none;

  font-size:14px;
}

.login-btn{
  width:100%;
  margin-top:22px;
  padding:15px;

  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#137ee9,#0b57a4);

  color:white;

  font-weight:bold;

  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  font-size:12px;
}

.message.show{
  display:block;
}

.error{
  background:rgba(255,80,70,.1);
  color:#ff998d;
}

.success{
  background:rgba(48,220,140,.1);
  color:#66e6a5;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;

  font-size:12px;

  color:#8fa0b4;

  text-decoration:none;
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="login-box">

  <div class="logo">🔐</div>

  <h1>Admin Login</h1>

  <p class="subtitle">
    GAYATRI INDUSTRIES • SECURE ACCESS
  </p>


  <div class="field">

    <label>ADMIN EMAIL</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >

  </div>


  <div class="field">

    <label>PASSWORD</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

  </div>


  <button
    class="login-btn"
    id="loginBtn"
  >
    🔐 Login to Dashboard
  </button>


  <div
    class="message"
    id="message"
  ></div>


  <a
    href="./index.html"
    class="back"
  >
    ← Back to Home
  </a>

</div>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://ysdpsndophokczdqysiw.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZHBzbmRvcGhva2N6ZHF5c2l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDE4OTMsImV4cCI6MjEwMjcxNzg5M30.OOUs696nMFc8TByXE39U2PBELo_gUurq6npcPsoG8Ww";


/* =====================================
   CREATE SUPABASE CLIENT

   IMPORTANT:
   SAME storageKey will be used
   in admin.html
===================================== */

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false,
      storage:window.localStorage,
      storageKey:"gayatri-admin-auth"
    }
  }
);


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(text,type){

  const message =
  document.getElementById("message");

  message.textContent = text;

  message.className =
  "message show " + type;

}


/* =====================================
   LOGIN
===================================== */

async function login(){

  const email =
  document
  .getElementById("email")
  .value
  .trim();

  const password =
  document
  .getElementById("password")
  .value;


  if(!email || !password){

    showMessage(
      "Please enter email and password.",
      "error"
    );

    return;

  }


  const button =
  document.getElementById("loginBtn");


  button.disabled = true;

  button.textContent =
  "Logging in...";


  try{


    /* Clear old broken session first */

    await supabaseClient
    .auth
    .signOut();


    /* Login */

    const {
      data,
      error
    } =
    await supabaseClient
    .auth
    .signInWithPassword({
      email:email,
      password:password
    });


    if(error){

      throw error;

    }


    if(
      !data ||
      !data.session
    ){

      throw new Error(
        "Login successful but session was not created."
      );

    }


    console.log(
      "LOGIN SUCCESS"
    );

    console.log(
      "SESSION:",
      data.session
    );


    /* Confirm session is stored */

    const {
      data:sessionData
    } =
    await supabaseClient
    .auth
    .getSession();


    if(
      !sessionData ||
      !sessionData.session
    ){

      throw new Error(
        "Session could not be saved. Please try again."
      );

    }


    showMessage(
      "Login successful! Opening dashboard...",
      "success"
    );


    /* Redirect */

    setTimeout(() => {

      window.location.href =
      "./admin.html";

    },1000);


  }
  catch(error){


    console.error(
      "LOGIN ERROR:",
      error
    );


    button.disabled = false;

    button.textContent =
    "🔐 Login to Dashboard";


    showMessage(
      error.message ||
      "Login failed. Please try again.",
      "error"
    );

  }

}


/* =====================================
   LOGIN BUTTON
===================================== */

document
.getElementById("loginBtn")
.addEventListener(
  "click",
  login
);


/* =====================================
   ENTER KEY
===================================== */

document
.getElementById("email")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      document
      .getElementById("password")
      .focus();

    }

  }
);


document
.getElementById("password")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      login();

    }

  }
);


/* =====================================
   CHECK EXISTING SESSION
===================================== */

async function checkExistingLogin(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
    .auth
    .getSession();


    if(error){

      console.error(
        "SESSION CHECK ERROR:",
        error
      );

      return;

    }


    if(
      data &&
      data.session
    ){

      console.log(
        "Existing admin session found"
      );

    }

  }
  catch(error){

    console.error(
      "SESSION CHECK FAILED:",
      error
    );

  }

}


checkExistingLogin();

</script>

</body>
</html>
